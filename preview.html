<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>GLB 预览</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0d14; overflow: hidden; }
      canvas { display: block; }
      #info { position: fixed; left: 12px; top: 10px; color: #7fe9ff; font: 12px monospace; }
    </style>
  </head>
  <body>
    <div id="info"></div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      const params = new URLSearchParams(location.search);
      const angleDeg = Number(params.get('ang') || 0);
      const file = params.get('file') || '/models/ship.glb';

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0d14);
      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);

      scene.add(new THREE.AmbientLight(0x9fb4cc, 2.2));
      const key = new THREE.DirectionalLight(0xffffff, 3.0);
      key.position.set(3, 5, 4);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x4a8cff, 2.0);
      rim.position.set(-4, 2, -3);
      scene.add(rim);

      new GLTFLoader().load(file, (gltf) => {
        const root = gltf.scene;
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        let tris = 0;
        root.traverse((o) => {
          if (!o.isMesh) return;
          const g = o.geometry;
          if (!g.attributes.normal) g.computeVertexNormals();
          tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
          // 保留模型自带材质（有自发光件的模型才看得出效果）；缺材质的补一个默认灰
          if (!o.material) {
            o.material = new THREE.MeshStandardMaterial({
              color: 0x9fb4cc, metalness: 0.55, roughness: 0.45,
            });
          }
        });

        root.position.sub(center);
        const s = 4.2 / Math.max(size.x, size.y, size.z);
        root.scale.setScalar(s);
        // 地面网格做参照
        const grid = new THREE.GridHelper(8, 16, 0x1d3a52, 0x122534);
        grid.position.y = -1.2;
        scene.add(grid);
        scene.add(root);

        const rad = THREE.MathUtils.degToRad(angleDeg);
        camera.position.set(Math.sin(rad) * 7, 2.6, Math.cos(rad) * 7);
        camera.lookAt(0, 0, 0);

        const info = document.getElementById('info');
        info.innerHTML = `ang=${angleDeg}° · ${(tris / 1000).toFixed(0)}k tri<br>`
          + `bbox ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`;
        renderer.render(scene, camera);
      }, undefined, (e) => {
        document.getElementById('info').textContent = '加载失败: ' + e;
      });
    </script>
  </body>
</html>
